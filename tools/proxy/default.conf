# One entry port for the app pod: nginx listens on 8080 and forwards by path to
# the three servers of the app container, which it reaches on localhost because
# the containers of a pod share one network namespace.
#
#   /pmtiles-data/...   -> 127.0.0.1:8505  tile server      (prefix removed)
#   /derivate-bbox/...  -> 127.0.0.1:8503  raster server    (prefix removed)
#   everything else     -> 127.0.0.1:8501  Streamlit, including its WebSocket
#
# Why: with one Service per port, the Ingress pins a browser per Service, so a
# session's raster-job files could be asked from another pod than the one that
# made them (README.md). One port means one Service and one pin for all three.
#
# No ${...} in this file: Flux substitutes that form in everything it applies.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    # The Ingress in front already logs every request.
    access_log off;

    # Redirects must not carry this container's own port.
    absolute_redirect off;

    # Streamlit's maxUploadSize is 10 MB (docker/streamlit_config.toml).
    client_max_body_size 16m;

    # Streamed through, not collected first: tiles are read with Range
    # requests, and raster downloads are written while they are built.
    proxy_buffering off;
    proxy_request_buffering off;
    # 16k for the response headers, as on the Ingress; nginx wants the body
    # buffers sized to match even though buffering is off.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_http_version 1.1;

    # The WebSocket stays open for as long as a session lives; the Ingress
    # allows the same 24 hours.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Host as the browser sent it. The X-Forwarded-* headers of the Ingress
    # pass through unchanged, like every other request header.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # For the pod's readiness probe: is nginx itself up?
    location = /proxy-healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The prefix with or without a trailing part, and nothing that merely
    # starts with the same letters.
    location = /pmtiles-data {
        rewrite ^ / break;
        proxy_pass http://127.0.0.1:8505;
    }
    location /pmtiles-data/ {
        rewrite ^/pmtiles-data/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8505;
    }

    location = /derivate-bbox {
        rewrite ^ / break;
        proxy_pass http://127.0.0.1:8503;
    }
    location /derivate-bbox/ {
        rewrite ^/derivate-bbox/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8503;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
    }
}
