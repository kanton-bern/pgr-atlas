# Re-scans, once a week, the images the stages actually run, with Trivy.
#
# The build workflows (build-and-push.yml, build-proxy.yml, build-s3tools.yml)
# scan an image once, when it is built. A CVE published after that goes
# unnoticed while the release keeps running, often for months (the proxy and
# the toolbox are rebuilt rarely). This workflow closes that gap: it reads the
# tags the stages run from Git (deploy/stages/{test,prod}, see
# .github/scripts/running-images.sh) and scans each distinct image with the
# same pinned Trivy, flags and .trivyignore as the build. Nobody else scans
# these images for us, so this scan has to stand on its own.
#
# How to read it: the job summary lists each image, the stages that run it
# and its findings (fixable HIGH and CRITICAL, minus .trivyignore). The job
# fails when any running image has one. On main it then opens (or updates)
# one issue labelled `alert: image scan`, assigned to ALERT_ASSIGNEE, and
# closes it on the first clean run (.github/scripts/alert-issue.sh); the
# issue's mail is the signal. Fix it with a new release of that image and a stage bump, or accept the
# finding in .trivyignore with its reason.
#
# Scans pull the images from the public ghcr.io (the same tag the stages pull
# through Bedag's mirror), so the job needs no secrets.
name: Scan running images

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the alert issue

env:
  ALERT_ASSIGNEE: bskerlak

# A manual run while the weekly one is still going waits for it.
concurrency:
  group: scan-images

jobs:
  scan:
    name: Scan the running images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing below needs git credentials; don't leave the token in .git/config
          persist-credentials: false

      - name: List the running images
        run: |
          set -euo pipefail
          yq --version
          .github/scripts/running-images.sh > "$RUNNER_TEMP/images.tsv"
          cat "$RUNNER_TEMP/images.tsv"

      # Trivy's results per image layer (about 1 MB). With them, an image
      # scanned before is not downloaded again: about 1 s instead of a minute
      # per app image. A miss (GitHub drops a cache unused for 7 days) costs
      # one cold run. The vulnerability DB is not cached: it changes every 6 h.
      # The key changes with scan-images.sh, which pins the Trivy version.
      # Restore and save are separate steps, so a red run still saves it.
      - name: Restore Trivy's layer cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-layers-${{ hashFiles('.github/scripts/scan-images.sh') }}-${{ github.run_id }}
          restore-keys: trivy-layers-${{ hashFiles('.github/scripts/scan-images.sh') }}-

      - name: Scan (Trivy)
        id: scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          SCAN_REPORT: ${{ runner.temp }}/report.md
        run: .github/scripts/scan-images.sh "$RUNNER_TEMP/images.tsv"

      - name: Job summary
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      # Only from main: a manual run on a branch must not open or close it.
      - name: Alert issue
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: >-
          .github/scripts/alert-issue.sh "alert: image scan"
          "Running images have fixable HIGH/CRITICAL findings"
          "$RUNNER_TEMP/report.md" "$OUTCOME"

      - name: Save Trivy's layer cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-layers-${{ hashFiles('.github/scripts/scan-images.sh') }}-${{ github.run_id }}

      # Uploading the SARIF to code scanning (free for a public repository) would go here.
