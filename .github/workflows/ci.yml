# Hooks, lint and a workflow audit: every check that needs neither Node nor a
# browser, in one job.
#
# Runs on every pull request that changes more than docs, and before a release
# image is built (build-and-push.yml calls it for version tags). On the GitHub
# Free plan the repo has no branch protection, so a green PR is required by
# convention (docs/deployment-process.md).
#
# One job, not one per check: GitHub bills every job rounded up to a full
# minute, and these checks together take under one. The tests are in workflows
# of their own, which start at the same time as this one, each only when a pull
# request changes what it tests (their `paths` filters):
#
#   ci.yml        always: hooks, gitleaks, stage build, SOPS, workflow audit, ruff
#   unit.yml      pytest without browser tests, no container (about 1 min)
#   frontend.yml  frontend/ lint, Vitest and build, then the map-component tests
#                 in the Playwright container (about 4 min)
#
# None waits for another, so a failure here doesn't stop the tests. Called for
# a release, all three run.
name: CI

on:
  pull_request:
    # Markdown alone doesn't run CI, except app/legal/: the app shows those pages,
    # and the download dialog links to a heading on one of them.
    paths: ["**", "!**.md", "!docs/**", "app/legal/**"]
  workflow_call: {}

permissions:
  contents: read

# A new push to a pull request cancels the run for the one before. Runs called
# from build-and-push.yml each get their own group, so none is cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First the checks that read the checkout as it is: the install below
      # adds .venv, which gitleaks would scan too.
      # The first repo in .pre-commit-config.yaml is Bedag's, reachable over SSH
      # only, and syncs the file itself (profile_sync), so it is not edited here.
      # CI runs a copy without it. The gitleaks hook scans staged changes only,
      # which is nothing in CI; the next step scans the checkout instead.
      - name: Write CI copy of the pre-commit config
        run: |
          yq 'del(.repos[] | select(.repo | test("mgmtbi")))' .pre-commit-config.yaml \
            > "$RUNNER_TEMP/pre-commit-ci.yaml"

      - name: Pre-commit hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: gitleaks-docker
        with:
          prek-version: "0.5.3"
          extra-args: --all-files --config ${{ runner.temp }}/pre-commit-ci.yaml
          cache: false

      - name: Gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --no-banner

      # The stages Flux applies from main, on test and prod: a broken overlay would
      # otherwise only show when Flux applies it after the merge. `${stage}` stays
      # literal here (Flux substitutes it later); kustomize accepts it.
      - name: Kustomize build (test, prod)
        env:
          VERSION: "5.5.0"
          SHA256: 6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77
        run: |
          tarball="kustomize_v${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" kustomize
          for stage in test prod; do
            "$RUNNER_TEMP/kustomize" build "deploy/stages/$stage" > /dev/null
            echo "deploy/stages/$stage builds"
          done

      # Stands in for Bedag's ensure_sops hook, which CI can't fetch.
      - name: Secrets are SOPS-encrypted
        run: |
          status=0
          for f in deploy/stages/*/*/secrets/secret-values.yaml \
              deploy/stages/*/s3-toolbox/hosttech-key-secret.yaml; do
            grep -q '^sops:' "$f" || { echo "::error file=$f::not SOPS-encrypted (no sops: block)"; status=1; }
          done
          exit "$status"

      - name: Actionlint
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Not the repo root: zizmor also audits .pre-commit-config.yaml there
          # and fails to parse its SSH-only first repo.
          inputs: .github/
          version: "1.30.1"
          advanced-security: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          python-version: "3.12"
          activate-environment: true
          enable-cache: false

      - name: Install dev tools
        run: uv sync --frozen --only-dev

      - name: Ruff
        run: ruff check app tests tools packages

      # The Playwright container (frontend.yml, and e2e.yml) brings the
      # browsers for one playwright version.
      - name: Playwright containers match uv.lock
        run: |
          locked=$(awk '/^name = "playwright"$/ { getline; gsub(/version = |"/, ""); print }' uv.lock)
          images=$(grep -ohP 'image: .*playwright/python:v\K[0-9.]+' .github/workflows/*.yml | sort -u | tr '\n' ' ')
          echo "uv.lock: ${locked:-?}, containers: ${images:-?}"
          if [ -z "$locked" ] || [ "$images" != "$locked " ]; then
            echo "::error file=.github/workflows/ci.yml::playwright is $locked in uv.lock but the workflows use container version(s) $images; move all together"
            exit 1
          fi

      - name: Ruff format
        run: ruff format --check app tests tools packages
