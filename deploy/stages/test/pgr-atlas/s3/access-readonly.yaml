# Read-only key for the bucket, for the app (from Bedag, 2026-10-05). The
# operator writes it into the Secret named in destinationSecret. What the
# GlobalS3Policy "readonly" allows is Bedag's definition; our role can't read it.
apiVersion: s3.bedag.ch/v1alpha1
kind: S3Access
metadata:
  name: pgr-atlas-ro
spec:
  s3BucketRef:
    name: aw3-pgr-atlas-test
  policyRefs:
    - kind: GlobalS3Policy
      name: readonly
  connectionDetails:
    mode: All
    destinationSecret: s3-pgr-atlas-ro
