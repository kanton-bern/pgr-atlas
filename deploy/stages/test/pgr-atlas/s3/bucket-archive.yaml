# A second bucket in the stage's tenant, for archive data (2026-10-08). It
# shares the tenant's quota with aw3-pgr-atlas-test. Not versioned until
# `s3m versioning` switches it on (docs/s3.md, section 5).
apiVersion: s3.bedag.ch/v1alpha1
kind: S3Bucket
metadata:
  name: aw3-pgr-atlas-test-archive
spec:
  bucketName: aw3-pgr-atlas-test-archive
  s3TenantRef:
    name: aw3-pgr-atlas-s3-test
