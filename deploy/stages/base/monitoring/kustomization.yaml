apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Alert rules for the app and the ServiceMonitor for its own metrics, the same
# on every stage (docs/monitoring.md). Where the alerts go (AlertmanagerConfig)
# is per stage: deploy/applied-by-bedag/<stage>/.
resources:
  - prometheusrule.yaml
  - servicemonitor.yaml
