---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secret Helm values, SOPS-encrypted (Bedag's approach): secret-values.yaml sets
# components.app.controller.containers.app.envSecret, which the chart renders
# into the Secret "pgr-atlas-app-app" and wires into the container via envFrom.
# Empty since 2026-10-09 (the app has no secret of its own; Bedag's S3 key
# comes from the operator's Secret), so the chart renders no Secret. The file
# stays: Flux doesn't prune, and without it the old Secret would keep its key.
secretGenerator:
- name: pgr-atlas-stage-secrets
  files:
  - values.yaml=secret-values.yaml
  type: "Opaque"
  options:
    disableNameSuffixHash: true
