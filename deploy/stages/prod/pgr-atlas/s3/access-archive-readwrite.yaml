# Read-write key for the archive bucket, the same policy as
# access-readwrite.yaml has for aw3-pgr-atlas-prod (writes and overwrites, no
# deletes). The operator writes it into the Secret named in destinationSecret;
# the s3-toolbox uses it as the remote bedag_archive_rw.
apiVersion: s3.bedag.ch/v1alpha1
kind: S3Access
metadata:
  name: pgr-datatransfer-archive-rw
spec:
  s3BucketRef:
    name: aw3-pgr-atlas-prod-archive
  policyRefs:
    - kind: GlobalS3Policy
      name: readwrite
  connectionDetails:
    mode: All
    destinationSecret: s3-pgr-datatransfer-archive-rw
