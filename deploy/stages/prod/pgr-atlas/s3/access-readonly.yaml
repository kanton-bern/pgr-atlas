# Read-only key for the bucket, for the app. Same as on test, where it was
# checked on 2026-10-05 (docs/s3.md, section 2). The operator writes it into
# the Secret named in destinationSecret.
apiVersion: s3.bedag.ch/v1alpha1
kind: S3Access
metadata:
  name: pgr-atlas-ro
spec:
  s3BucketRef:
    name: aw3-pgr-atlas-prod
  policyRefs:
    - kind: GlobalS3Policy
      name: readonly
  connectionDetails:
    mode: All
    destinationSecret: s3-pgr-atlas-ro
