fr = "Le fichier déclare {crs}, mais les coordonnées reprojetées se trouvent bien en dehors de la Suisse - mauvais système de coordonnées ?"

[upload.crs_still_outside]
de = "Auch mit diesem Koordinatensystem liegen die Koordinaten weit ausserhalb der Schweiz - bitte ein anderes wählen oder die Datei prüfen."
fr = "Avec ce système de coordonnées aussi, les coordonnées se trouvent bien en dehors de la Suisse - veuillez en choisir un autre ou vérifier le fichier."

[upload.too_big]
de = "Datei ist zu gross, zu komplex oder beschädigt - erwartet wird eine kleine Datei mit genau einem Polygon."
fr = "Le fichier est trop grand, trop complexe ou endommagé - un petit fichier contenant exactement un polygone est attendu."

[upload.unreadable]
de = "Datei konnte nicht gelesen werden. Unterstützt: GeoJSON, KML, GeoParquet, Shapefile (als .zip oder als lose .shp/.shx/.dbf/... Dateien)."
fr = "Le fichier n’a pas pu être lu. Formats pris en charge : GeoJSON, KML, GeoParquet, Shapefile (en .zip ou en fichiers .shp/.shx/.dbf/... séparés)."

[upload.unsupported_type]
de = "Dateityp von «{name}» wird nicht unterstützt. Unterstützt: GeoJSON, KML, GeoParquet, Shapefile (als .zip oder als lose .shp/.shx/.dbf/... Dateien)."
fr = "Le type de fichier de « {name} » n’est pas pris en charge. Formats pris en charge : GeoJSON, KML, GeoParquet, Shapefile (en .zip ou en fichiers .shp/.shx/.dbf/... séparés)."

[upload.not_geojson]
de = "Datei ist kein GeoJSON."
fr = "Le fichier n’est pas un GeoJSON."

[upload.not_kml]
de = "Datei ist kein KML."
fr = "Le fichier n’est pas un KML."

[upload.not_shapefile]
de = "Datei ist kein Shapefile."
fr = "Le fichier n’est pas un Shapefile."

[upload.wrong_format]
de = "Datei ist beschädigt oder hat nicht das Format ihrer Endung."
fr = "Le fichier est endommagé ou n’a pas le format de son extension."

[upload.parquet_brotli]
de = "GeoParquet-Dateien mit Brotli-Kompression werden wegen einer Sicherheitslücke in Brotli (CVE-2026-111497) vorübergehend abgelehnt ([Meldung des BACS](https://security-hub.ncsc.admin.ch/#/posts/13105)). Bitte die Datei mit ZSTD- oder Snappy-Kompression speichern oder als GeoJSON hochladen."
fr = "Les fichiers GeoParquet compressés avec Brotli sont temporairement refusés en raison d’une faille de sécurité dans Brotli (CVE-2026-111497) ([avis de l’OFCS](https://security-hub.ncsc.admin.ch/#/posts/13105)). Veuillez enregistrer le fichier avec la compression ZSTD ou Snappy, ou le téléverser au format GeoJSON."

[upload.bad_zip]
de = "ZIP-Datei ist beschädigt oder kein gültiges ZIP-Archiv."
fr = "Le fichier ZIP est endommagé ou n’est pas une archive ZIP valide."

[upload.zip_no_shp]
de = "Im ZIP wurde keine .shp-Datei gefunden (Shapefile erwartet)."
fr = "Aucun fichier .shp trouvé dans le ZIP (Shapefile attendu)."

[upload.zip_too_many_entries]
de = "ZIP-Archiv enthält {n_entries} Einträge - maximal {max_entries} erlaubt."
fr = "L’archive ZIP contient {n_entries} entrées - {max_entries} au maximum autorisées."

[upload.zip_too_large]
de = "ZIP-Archiv ergibt entpackt {size_mb} MB - maximal {max_mb} MB erlaubt."
fr = "L’archive ZIP fait {size_mb} MB une fois décompressée - {max_mb} MB au maximum autorisés."

[upload.zip_ratio]
de = "Eintrag «{name}» hat ein Kompressionsverhältnis von {ratio}:1 - maximal {max_ratio}:1 erlaubt."
fr = "L’entrée « {name} » a un taux de compression de {ratio}:1 - {max_ratio}:1 au maximum autorisé."

[upload.files_no_shp]
de = "Mehrere Dateien hochgeladen, aber keine .shp darunter - bei mehreren Dateien wird ein Shapefile-Bündel (.shp zusammen mit .shx/.dbf/...) erwartet."
fr = "Plusieurs fichiers téléversés, mais aucun .shp parmi eux - pour plusieurs fichiers, un ensemble Shapefile (.shp avec .shx/.dbf/...) est attendu."

[upload.shp_part_alone]
de = "Datei kann nicht allein gelesen werden - ein Shapefile braucht die .shp zusammen mit .shx/.dbf/..., sonst GeoJSON, KML oder GeoParquet hochladen."
fr = "Le fichier ne peut pas être lu seul - un Shapefile nécessite le .shp avec .shx/.dbf/..., sinon téléverser un GeoJSON, KML ou GeoParquet."

[upload.too_many_files]
de = "Zu viele Dateien ({n_files}) - maximal {max_files} erlaubt."
fr = "Trop de fichiers ({n_files}) - {max_files} au maximum autorisés."

[upload.bad_name]
de = "Ungültiger Dateiname «{name}» - bitte eine Datei ohne Verzeichnisangabe hochladen."
fr = "Nom de fichier « {name} » non valide - veuillez téléverser un fichier sans indication de répertoire."

[upload.no_geometry]
de = "Datei enthält keine Geometrie."
fr = "Le fichier ne contient aucune géométrie."

[upload.too_many_objects]
de = "Datei enthält {n_objects} Objekte - bitte eine Datei mit genau einem Polygon hochladen (mehrere Objekte pro Datei werden noch nicht unterstützt)."
fr = "Le fichier contient {n_objects} objets - veuillez téléverser un fichier contenant exactement un polygone (plusieurs objets par fichier ne sont pas encore pris en charge)."

[upload.unsupported_geometry]
de = "Geometrietyp „{geom_type}“ wird nicht unterstützt - es wird genau ein Polygon erwartet."
fr = "Le type de géométrie « {geom_type} » n’est pas pris en charge - exactement un polygone est attendu."

[upload.geometry_empty]
note = "Takes the place of the geometry type in upload.unsupported_geometry when the file's object has no geometry."
