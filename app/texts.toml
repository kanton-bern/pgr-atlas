# Edit only the text in quotes after `de =` or `fr =`. Keep every {placeholder}
# exactly as it is; the app fills it in. An empty `fr = ""` shows the German text.
# `note` explains the text for the translator. How to change a text, step by step:
# docs/texts-guide.md

