# ── Experten-Modus ──────────────────────────────────────────────────────────

[expert.toggle]
de = "🔬 Experten-Modus"
fr = "🔬 Mode expert"

[expert.toggle_help]
de = 'Überschreibt probabilistische Annahmen ad-hoc für diese Sitzung (p_h/Anrissmächtigkeit, p_Ablauf/μ-ξ-τ₀, pro-Anriss-Faktoren). Wirkt auf IFK-Berechnung und Ad-Hoc Raster Karten. Nichts wird gespeichert oder in der Produktion verwendet - nur zum Testen "was wäre wenn"-Szenarien. Beta.'
fr = "Remplace des hypothèses probabilistes de façon ad hoc pour cette session (p_h/épaisseur de déclenchement, p_Ablauf/μ-ξ-τ₀, facteurs par zone de déclenchement). Agit sur le calcul CIF et les cartes raster ad hoc. Rien n’est enregistré ni utilisé en production - uniquement pour tester des scénarios « et si ». Bêta."

[expert.beta_note]
note = "{contact} is the address for feedback on the app."
de = "⚠️ **Beta-Feature.** Angepasste Wahrscheinlichkeiten - Ergebnisse sind **nicht offiziell**. Die Wahrscheinlichkeiten werden nicht gespeichert. Feedback an {contact}."
fr = "⚠️ **Fonction bêta.** Probabilités modifiées - les résultats ne sont **pas officiels**. Les probabilités ne sont pas enregistrées. Commentaires à {contact}."

