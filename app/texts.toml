# ── IFK eines Gebiets ───────────────────────────────────────────────────────

[ifk_area.submit]
de = "▶️ IFK des Gebiets berechnen"
fr = "▶️ Calculer la CIF de la zone"

[ifk_area.spinner]
de = "Berechne IFK des Gebiets…"
fr = "Calcul de la CIF de la zone…"

[ifk_area.rule]
de = "**IFK des Gebiets** - jede Simulation zählt einmal, mit ihrer grössten Intensität über alle Pixel im Gebiet (Fliesstiefe, Fliessgeschwindigkeit und Druck je für sich). Die Kurven zeigen also, wie oft das Gebiet irgendwo mindestens so stark getroffen wird."
fr = "**CIF de la zone** - chaque simulation compte une fois, avec son intensité maximale sur tous les pixels de la zone (hauteur d’écoulement, vitesse d’écoulement et pression chacune séparément). Les courbes indiquent donc à quelle fréquence la zone est touchée, quelque part, au moins aussi fortement."

[ifk_area.no_process]
de = "Kein simulierter Prozess erreicht das Gebiet."
fr = "Aucun processus simulé n’atteint la zone."

[ifk_area.aborted]
