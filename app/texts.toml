[derivate.metric_help.combined_hit_rate]
note = "Keep the formulas between $ signs exactly as they are."
de = "**Rate** $\\lambda$: erwartete Anzahl Ereignisse pro Jahr, bei denen alle Bedingungen im selben Ereignis am selben Pixel erfüllt sind: die Summe der Ereignisraten dieser Szenarien.  \n**Wahrscheinlichkeit in 80 Jahren** von mindestens einem solchen Ereignis (Poisson-Prozess): $P = 1 - e^{-80\\,\\lambda}$."
fr = "**Taux** $\\lambda$ : nombre d’événements attendus par an pour lesquels toutes les conditions sont remplies dans le même événement au même pixel : la somme des taux d’événements de ces scénarios.  \n**Probabilité en 80 ans** d’au moins un tel événement (processus de Poisson) : $P = 1 - e^{-80\\,\\lambda}$."

[derivate.metric_help.start_rate]
de = "Erwartete Anzahl Anrisse pro Jahr (ab der gewählten Anrissmächtigkeit), deren Anrisskreis den Pixel überdeckt - jeder überdeckte Pixel erhält die volle Rate des Anrisses, Flächensummen zählen Anrisse daher mehrfach."
fr = "Nombre attendu de déclenchements par an (à partir de l’épaisseur de déclenchement choisie) dont le cercle de déclenchement recouvre le pixel - chaque pixel recouvert reçoit le taux complet du déclenchement, les sommes de surfaces comptent donc plusieurs fois les déclenchements."

[derivate.metric_help.sim_count]
de = "Anzahl Simulationen, die den Pixel erreichen - ungewichtet, ohne Wahrscheinlichkeiten."
fr = "Nombre de simulations qui atteignent le pixel - non pondéré, sans probabilités."

